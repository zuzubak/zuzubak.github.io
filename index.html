<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malcolm Kennedy</title>
<meta name="description" content="Maps and data visualizations by Malcolm Kennedy.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --tile-bg: #f4f4f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --tile-bg: #1b1b1b;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 24px 40px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  h1 a { color: inherit; text-decoration: none; }
  .tagline {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 32px;
  }

  .tile { text-decoration: none; color: inherit; display: block; }
  .tile .thumb {
    aspect-ratio: 4 / 3;
    background: var(--tile-bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .tile .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 400ms ease;
  }
  .tile:hover .thumb img { transform: scale(1.04); }
  .tile h2 {
    margin: 14px 0 4px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .tile p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  footer {
    border-top: 1px solid var(--line);
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1><a href="/">Malcolm Kennedy</a></h1>
  <p class="tagline">Maps &amp; data about Toronto</p>
</header>

<main>
  <div class="grid">

    <!-- TILE: copy this block for each new map. Change href, img src, title, blurb. -->
    <a class="tile" href="/transit-driving/">
      <div class="thumb"><img src="/transit-driving/thumb.png" alt=""></div>
      <h2>Transit vs. Driving</h2>
      <p>Travel-time comparison across the city.</p>
    </a>

    <a class="tile" href="/rosedale-taxes/">
      <div class="thumb"><img src="/rosedale-taxes/thumb.png" alt=""></div>
      <h2>Rosedale Property Taxes</h2>
      <p>Assessed value and tax burden, parcel by parcel.</p>
    </a>

    <a class="tile" href="/heritage-trees/">
      <div class="thumb"><img src="/heritage-trees/thumb.png" alt=""></div>
      <h2>Heritage Trees</h2>
      <p>Notable trees in the city's street canopy.</p>
    </a>

  </div>
</main>

<footer>
  <span>&copy; Malcolm Kennedy</span>
  <a href="https://github.com/zuzubak">GitHub</a>
</footer>

</body>
</html>
