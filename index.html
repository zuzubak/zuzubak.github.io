<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malcolm Kennedy</title>
<meta name="description" content="Maps and data visualizations by Malcolm Kennedy.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --tile-bg: #f4f4f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --tile-bg: #1b1b1b;
    }
  }

  @font-face {
    font-family: "Toronto Subway";
    src: url("fonts/TorontoSubway-Bold.woff2") format("woff2"),
         url("fonts/TorontoSubway-Bold.woff") format("woff");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 24px 40px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: "Toronto Subway", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: clamp(26px, 4.4vw, 40px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  h1 a { color: inherit; text-decoration: none; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 32px;
  }

  .tile { text-decoration: none; color: inherit; display: block; }
  .tile .thumb {
    aspect-ratio: 4 / 3;
    background: var(--tile-bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .tile .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 400ms ease;
  }
  .tile:hover .thumb img { transform: scale(1.04); }
  .tile h2 {
    margin: 14px 0 4px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .tile p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  footer {
    border-top: 1px solid var(--line);
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .social { display: flex; gap: 16px; margin-left: auto; }
  .social a {
    color: var(--fg);
    display: inline-flex;
    opacity: 0.75;
    transition: opacity 150ms ease;
  }
  .social a:hover { opacity: 1; }
  .social svg { width: 22px; height: 22px; display: block; fill: currentColor; }
</style>
</head>
<body>

<header>
  <h1><a href="index.html">Malcolm Kennedy</a></h1>
</header>

<main>
  <div class="grid">

    <!-- TILE: copy this block for each new map. Change href, img src, title, blurb. -->
    <a class="tile" href="street-distance-per-household/">
      <div class="thumb"><img src="street-distance-per-household/thumb.png" alt=""></div>
      <h2>Street Distance per Household</h2>
      <p>Metres of road each household relies on, by neighbourhood.</p>
    </a>

    <a class="tile" href="https://qgiscloud.com/mkennedy/toronto_transit_by_block_cloud/?l=Toronto_5pm_2Dec_census_blocks_forecasted&amp;bl=mapnik&amp;t=toronto_transit_by_block_cloud&amp;e=-8853431%2C5402078%2C-8836282%2C5429597">
      <div class="thumb"><img src="transit-driving/thumb.jpg" alt=""></div>
      <h2>Transit vs. Driving</h2>
      <p>Travel-time comparison across the city.</p>
    </a>

  </div>
</main>
