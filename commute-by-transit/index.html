<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commute By Transit</title>
<meta name="description" content="Click anywhere in Toronto to see how long it takes to get there by transit from every city block.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --surface:        #fcfcfb;
    --surface-sunk:   #f0efec;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       rgba(11, 11, 11, 0.10);
    --panel:          rgba(252, 252, 251, 0.92);
    --highlight:      #0b0b0b;
    --shadow:         0 1px 2px rgba(11,11,11,.06), 0 8px 28px rgba(11,11,11,.12);
    --accent:         #eb6834;

    /* Sequential: one hue, light -> dark. Palette blue, steps 100..700. */
    --seq-1: #b7d3f6; --seq-2: #86b6ef; --seq-3: #5598e7; --seq-4: #2a78d6;
    --seq-5: #1c5cab; --seq-6: #184f95; --seq-7: #0d366b;
    --unreachable:    #d8d7d2;
  }
  /* Dark mode swaps surfaces and ink but keeps the ramp identical, so a given
     travel time is the same colour in either theme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19; --surface-sunk: #383835;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --hairline: rgba(255,255,255,0.12); --panel: rgba(26,26,25,0.92);
      --highlight: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.55);
      --accent: #eb6834; --unreachable: #3a3a37;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1a1a19; --surface-sunk: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --hairline: rgba(255,255,255,0.12); --panel: rgba(26,26,25,0.92);
    --highlight: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.55);
    --accent: #eb6834; --unreachable: #3a3a37;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--surface); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #map { position: absolute; inset: 0; background: var(--surface); }
  .leaflet-container { font-family: inherit; background: var(--surface); cursor: crosshair; }

  #panel {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    width: 332px; max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow);
  }
  .panel-scroll { padding: 18px 18px 16px; }
  .panel-handle-row { display: none; }

  h1 {
    margin: 0 0 5px;
    font-family: "Toronto Subway", system-ui, sans-serif;
    font-size: 19px; font-weight: 700; letter-spacing: .10em;
    text-transform: uppercase; line-height: 1.2;
  }
  .subtitle { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.45; }
  .rule { height: 1px; background: var(--hairline); margin: 15px 0 13px; border: 0; }
  .field-label {
    display: block; margin: 0 0 7px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted);
  }

  /* Destination ------------------------------------------------------------ */
  .destination {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 8px;
    background: var(--surface-sunk);
  }
  .destination .pin {
    flex: none; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .destination .label { font-size: 12.5px; line-height: 1.4; color: var(--text-secondary); }
  .destination .label b { color: var(--text-primary); font-weight: 600; }
  .destination.loading .label::after { content: " …"; }

  /* Legend ----------------------------------------------------------------- */
  #ramp { display: flex; gap: 2px; height: 12px; }
  #ramp div { flex: 1 1 0; border-radius: 1.5px; }
  #ticks { display: flex; margin-top: 5px; font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  #ticks span { flex: 1 1 0; text-align: center; }
  #ticks span:first-child, #ticks span:last-child { flex: 0.5 1 0; }
  .legend-note { margin: 8px 0 0; font-size: 11px; line-height: 1.4; color: var(--text-muted); }
  .swatch-row { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 11px; color: var(--text-muted); }
  .swatch-row i { width: 12px; height: 12px; border-radius: 2px; background: var(--unreachable); display: block; }

  /* Readout ---------------------------------------------------------------- */
  #readout { margin-top: 13px; min-height: 76px; }
  .readout-hint { margin: 9px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--text-muted); }
  .stat-row { display: flex; gap: 14px; margin: 0 0 8px; }
  .stat { flex: 1 1 0; }
  .stat dt { margin: 0 0 1px; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .stat dd { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.1; }
  .stat dd span { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .verdict { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--text-secondary); }
  .verdict b { color: var(--text-primary); font-weight: 600; }

  footer { margin-top: 14px; font-size: 10.5px; line-height: 1.5; color: var(--text-muted); }
  footer a { color: inherit; }

  .leaflet-control-attribution {
    background: var(--panel) !important; color: var(--text-muted) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--text-secondary) !important; }
  .leaflet-bar a {
    background: var(--panel) !important; color: var(--text-primary) !important;
    border-bottom-color: var(--hairline) !important;
  }
  .leaflet-bar a:hover { background: var(--surface-sunk) !important; }

  @media (max-width: 720px) {
    #panel {
      position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: auto;
      max-height: 42vh; border-radius: 14px 14px 0 0;
      border-left: 0; border-right: 0; border-bottom: 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,.18);
      transition: max-height 220ms ease;
    }
    #panel[data-state="minimized"] { max-height: 52px; }
    #panel[data-state="expanded"] { max-height: 82vh; }
    #panel.dragging { transition: none; }
    .panel-handle-row {
      position: sticky; top: 0; z-index: 1; display: flex; align-items: center;
      background: var(--panel);
    }
    .panel-drag-handle {
      display: flex; flex: 1; flex-direction: column; align-items: center; gap: 6px;
      padding: 10px 0 6px; border: 0; background: none; color: var(--text-secondary);
      font: inherit; cursor: grab; touch-action: none; user-select: none;
    }
    .handle-bar { width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); }
    .handle-label {
      font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted);
    }
    #panel[data-state="minimized"] .handle-label { display: none; }
    #panel[data-state="expanded"] .handle-label::after { content: " (tap to collapse)"; }
    .panel-hide-btn {
      flex: none; margin-right: 12px; padding: 5px 10px;
      border: 1px solid var(--hairline); border-radius: 999px;
      background: var(--surface-sunk); color: var(--text-secondary);
      font: inherit; font-size: 11px; cursor: pointer;
    }
    #panel[data-state="minimized"] .panel-hide-btn { display: none; }
    #panel[data-state="minimized"] .panel-scroll { display: none; }
    .panel-scroll { padding: 4px 18px 24px; }
    .leaflet-control-attribution { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
</style>
</head>
<body>
<script src="/header.js"></script>
<script src="/config.js"></script>
<script src="/carto.js"></script>


<div id="stage">
  <div id="map"></div>

  <aside id="panel" data-state="collapsed">
    <div class="panel-handle-row">
      <button class="panel-drag-handle" id="panel-toggle" aria-label="Toggle panel" aria-expanded="false">
        <span class="handle-bar"></span>
        <span class="handle-label">Legend &amp; details</span>
      </button>
      <button class="panel-hide-btn" id="panel-hide" aria-label="Hide panel and show the map">Hide</button>
    </div>

    <div class="panel-scroll">
      <h1>Commute By Transit</h1>
      <p class="subtitle">Click anywhere in Toronto. The map shows how long it takes to get there by transit from every other block, leaving at 8am on a weekday.</p>

      <hr class="rule">

      <span class="field-label">Destination</span>
      <div class="destination" id="destination">
        <span class="pin"></span>
        <span class="label" id="destination-label">Loading…</span>
      </div>

      <hr class="rule">

      <span class="field-label">Travel time (minutes)</span>
      <div id="ramp"></div>
      <div id="ticks"></div>
      <p class="legend-note">Darker is longer. Times are door-to-door, including walking and waiting.</p>
      <div class="swatch-row"><i></i> No trip under 2 hours</div>

      <div id="readout"></div>

      <footer id="footer"></footer>
    </div>
  </aside>
</div>

const UNREACHABLE = 121;

/* Geometry ---------------------------------------------------------------- */

function decodeRing(encoded) {
  const points = [];
  let index = 0, lat = 0, lon = 0;
  while (index < encoded.length) {
    const delta = [0, 0];
    for (let axis = 0; axis < 2; axis++) {
      let result = 0, shift = 0, byte;
      do {
        byte = encoded.charCodeAt(index++) - 63;
        result |= (byte & 0x1f) << shift;
        shift += 5;
      } while (byte >= 0x20);
      delta[axis] = (result & 1) ? ~(result >> 1) : (result >> 1);
    }
    lat += delta[0]; lon += delta[1];
    points.push([lat / 1e5, lon / 1e5]);
  }
  return points;
}

/* Colour ------------------------------------------------------------------ */

const styles = getComputedStyle(document.documentElement);
let ramp = [], unreachableColour = "#ccc";
function readRamp() {
  ramp = [];
  for (let i = 1; i <= 7; i++) ramp.push(styles.getPropertyValue(`--seq-${i}`).trim());
  unreachableColour = styles.getPropertyValue("--unreachable").trim();
}
readRamp();

function colourFor(minutes) {
  if (minutes === UNREACHABLE) return unreachableColour;
  let index = 0;
  while (index < DATA.edges.length && minutes >= DATA.edges[index]) index++;
  return ramp[index];
}

/* Map --------------------------------------------------------------------- */

const map = L.map("map", { zoomControl: false, preferCanvas: true, zoomSnap: 0.25 });
L.control.zoom({ position: "topright" }).addTo(map);

const cityBounds = L.latLngBounds([DATA.bounds[1], DATA.bounds[0]], [DATA.bounds[3], DATA.bounds[2]]);
map.fitBounds(cityBounds);

function frameCity() {
  const rect = document.getElementById("panel").getBoundingClientRect();
  const narrow = window.innerWidth <= 720;
  map.fitBounds(cityBounds, {
    paddingTopLeft: narrow ? [16, 16] : [rect.width + 32, 24],
    paddingBottomRight: narrow ? [16, rect.height + 16] : [24, 24],
    animate: false,
  });
}

const OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const CARTO = '&copy; <a href="https://carto.com/attributions">CARTO</a>';

const blocksPane = map.createPane("blocks");
blocksPane.style.zIndex = 350;
/* Translucency once for the whole pane: a per-polygon fillOpacity rasterises every
   shared border twice and the overlapping antialiasing composites into dark seams. */
blocksPane.style.opacity = 0.85;
const labelPane = map.createPane("labels");
labelPane.style.zIndex = 450;
labelPane.style.pointerEvents = "none";

let baseLayer = null, labelLayer = null;
function drawBasemap() {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const flavour = dark ? "dark" : "light";
  if (baseLayer) map.removeLayer(baseLayer);
  if (labelLayer) map.removeLayer(labelLayer);
  baseLayer = L.tileLayer(cartoTileUrl(`${flavour}_nolabels`),
    { maxZoom: 18, attribution: `${OSM} ${CARTO}` }).addTo(map);
  labelLayer = L.tileLayer(cartoTileUrl(`${flavour}_only_labels`),
    { maxZoom: 18, pane: "labels" }).addTo(map);
}
drawBasemap();

const renderer = L.canvas({ pane: "blocks", padding: 0.3 });

function strokeWeightForZoom() {
  const zoom = map.getZoom();
  if (zoom <= 11) return 1.5;
  if (zoom <= 13) return 1.0;
  return 0.5;
}

const blocks = DATA.geometry.map((polygons, i) => {
  const layer = L.polygon(polygons.map((poly) => poly.map(decodeRing)), {
    renderer: renderer,
    stroke: true,
    weight: strokeWeightForZoom(),
    color: "#000",
    fillOpacity: 1,
    fillColor: "#000",
  });
  layer.index = i;
  return layer;
});
const blockGroup = L.featureGroup(blocks).addTo(map);

let appliedStrokeWeight = strokeWeightForZoom();
map.on("zoomend", () => {
  const weight = strokeWeightForZoom();
  if (weight === appliedStrokeWeight) return;
  appliedStrokeWeight = weight;
  for (const layer of blocks) layer.options.weight = weight;
  renderer._redraw();
});

map.createPane("highlight").style.zIndex = 460;
map.getPane("highlight").style.pointerEvents = "none";
const highlightCasing = L.polygon([], { pane: "highlight", color: styles.getPropertyValue("--surface").trim(), weight: 4, fill: false }).addTo(map);
const highlight = L.polygon([], { pane: "highlight", color: styles.getPropertyValue("--highlight").trim(), weight: 2, fill: false }).addTo(map);
function setHighlight(latlngs) { highlightCasing.setLatLngs(latlngs); highlight.setLatLngs(latlngs); }

const destinationMarker = L.circleMarker([0, 0], {
  pane: "highlight", radius: 7, weight: 3,
  color: styles.getPropertyValue("--surface").trim(),
  fillColor: styles.getPropertyValue("--accent").trim(), fillOpacity: 1,
});

/* Travel times ------------------------------------------------------------ */

let times = null;          // Uint8Array of minutes, indexed by block
let destination = null;    // block index
const cache = new Map();   // block index -> Uint8Array

async function loadColumn(index) {
  if (cache.has(index)) return cache.get(index);
  const shard = Math.floor(index / 200);
  const response = await fetch(`d/${shard}/${index}.bin.gz`);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const stream = response.body.pipeThrough(new DecompressionStream("gzip"));
  const buffer = await new Response(stream).arrayBuffer();
  // Stored as int8 deltas; undo them to recover absolute minutes.
  const deltas = new Int8Array(buffer);
  const column = new Uint8Array(deltas.length);
  let running = 0;
  for (let i = 0; i < deltas.length; i++) {
    running += deltas[i];
    column[i] = running;
  }
  if (column.length !== DATA.count) throw new Error(`bad column length ${column.length}`);
  if (cache.size > 40) cache.delete(cache.keys().next().value);
  cache.set(index, column);
  return column;
}

function repaint() {
  for (const layer of blocks) {
    const colour = times ? colourFor(times[layer.index]) : unreachableColour;
    layer.options.fillColor = colour;
    layer.options.color = colour;
  }
  renderer._redraw();
}

async function selectDestination(index) {
  destination = index;
  const label = document.getElementById("destination-label");
  const box = document.getElementById("destination");
  box.classList.add("loading");
  label.textContent = "Loading travel times";

  const centre = DATA.centroids[index];
  destinationMarker.setLatLng(centre).addTo(map);

  try {
    times = await loadColumn(index);
  } catch (error) {
    box.classList.remove("loading");
    label.innerHTML = `<b>Could not load travel times.</b> ${error.message}`;
    return;
  }
  box.classList.remove("loading");
  label.innerHTML = `Travel time <b>to the marked block</b>. Click elsewhere to move it.`;
  repaint();
  renderSummary();
}

function formatTime(minutes) {
  if (minutes === UNREACHABLE) return "no trip under 2 h";
  if (minutes < 60) return `${minutes} min`;
  const h = Math.floor(minutes / 60), m = minutes % 60;
  return m ? `${h} h ${m} min` : `${h} h`;
}

function renderSummary() {
  if (!times) return;
  let sum = 0, count = 0, within30 = 0, within60 = 0;
  for (let i = 0; i < times.length; i++) {
    const value = times[i];
    if (value === UNREACHABLE) continue;
    sum += value; count++;
    if (value <= 30) within30++;
    if (value <= 60) within60++;
  }
  const mean = Math.round(sum / Math.max(count, 1));
  document.getElementById("readout").innerHTML = `
    <div class="stat-row">
      <dl class="stat"><dt>Within 30 min</dt><dd>${(within30 / DATA.count * 100).toFixed(0)}<span>% of blocks</span></dd></dl>
      <dl class="stat"><dt>Within 60 min</dt><dd>${(within60 / DATA.count * 100).toFixed(0)}<span>% of blocks</span></dd></dl>
    </div>
    <p class="verdict">Mean travel time from a reachable block is <b>${mean} min</b>.</p>
    <p class="readout-hint">Hover a block for its own travel time.</p>`;
}

function renderHover(index) {
  if (!times || index === null) { renderSummary(); return; }
  document.getElementById("readout").innerHTML = `
    <div class="stat-row">
      <dl class="stat"><dt>From this block</dt><dd>${formatTime(times[index])}</dd></dl>
    </div>
    <p class="verdict">Leaving at 8am on a weekday, by transit and on foot.</p>
    <p class="readout-hint">Click to make this block the destination.</p>`;
}

blockGroup.on("mouseover", (event) => {
  setHighlight(event.layer.getLatLngs());
  renderHover(event.layer.index);
});
blockGroup.on("mouseout", () => { setHighlight([]); renderHover(null); });
blockGroup.on("click", (event) => {
  L.DomEvent.stopPropagation(event.originalEvent);
  selectDestination(event.layer.index);
});

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  readRamp();
  highlight.setStyle({ color: styles.getPropertyValue("--highlight").trim() });
  highlightCasing.setStyle({ color: styles.getPropertyValue("--surface").trim() });
  destinationMarker.setStyle({ color: styles.getPropertyValue("--surface").trim(), fillColor: styles.getPropertyValue("--accent").trim() });
  drawBasemap();
  repaint();
  renderLegend();
});

/* Legend ------------------------------------------------------------------ */

function renderLegend() {
  document.getElementById("ramp").innerHTML =
    ramp.map((c) => `<div style="background:${c}"></div>`).join("");
  document.getElementById("ticks").innerHTML =
    "<span></span>" + DATA.edges.map((e) => `<span>${e}</span>`).join("") + "<span></span>";
  document.querySelector(".swatch-row i").style.background = unreachableColour;
}

    dragging = true; moved = false;
    startY = event.clientY;
    startHeight = panel.getBoundingClientRect().height;
    lastHeight = startHeight;
    panel.classList.add("dragging");
    panel.style.maxHeight = "none";
    try { panelToggle.setPointerCapture(event.pointerId); } catch (err) { /* optional */ }
  });
  panelToggle.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const deltaY = startY - event.clientY;
    if (Math.abs(deltaY) > DRAG_MOVE_THRESHOLD) moved = true;
    const maxHeight = window.innerHeight * PANEL_EXPANDED_VH + 24;
    lastHeight = Math.min(maxHeight, Math.max(PANEL_MINIMIZED_PX, startHeight + deltaY));
    panel.style.height = `${lastHeight}px`;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove("dragging");
    panel.style.height = ""; panel.style.maxHeight = "";
    if (!moved) return;
    const vh = window.innerHeight;
    const collapsed = vh * PANEL_COLLAPSED_VH, expanded = vh * PANEL_EXPANDED_VH;
    if (lastHeight < (PANEL_MINIMIZED_PX + collapsed) / 2) setPanelState("minimized");
    else if (lastHeight < (collapsed + expanded) / 2) setPanelState("collapsed");
    else setPanelState("expanded");
  }
  panelToggle.addEventListener("pointerup", endDrag);
  panelToggle.addEventListener("pointercancel", endDrag);
  panelToggle.addEventListener("click", () => {
    if (!isMobile()) return;
    setPanelState(panel.dataset.state === "expanded" ? "collapsed" : "expanded");
  });
})();

/* Boot -------------------------------------------------------------------- */

document.getElementById("footer").innerHTML =
  `${DATA.count.toLocaleString()} dissemination blocks, every pair precomputed. Routed with ` +
  `<a href="https://github.com/r5py/r5py">r5py</a> over the ` +
  `<a href="https://open.toronto.ca/dataset/ttc-routes-and-schedules/">TTC</a> and ` +
  `<a href="https://www.metrolinx.com/en/aboutus/opendata/">GO Transit</a> schedules plus ` +
  `<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> footpaths, ` +
  `walking at 4.8 km/h. Median over a 30-minute departure window, Wednesday 26 August 2026 ` +
  `(TTC summer schedule, so slightly thinner than term-time service). Scheduled service, not ` +
  `realtime. Checked against a 2022 Google reference for trips to Union: correlation 0.91, ` +
  `running about 13% high.`;

renderLegend();
repaint();
setPanelState("collapsed");
frameCity();
selectDestination(DATA.defaultDestination);

let resizeTimer;
window.addEventListener("resize", () => {
  if (!panel.classList.contains("dragging")) setPanelState(panel.dataset.state);
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(frameCity, 200);
});
</script>
</body>
</html>
