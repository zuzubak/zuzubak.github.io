<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit vs. Driving</title>
<meta name="description" content="Block-level map of transit and driving times to downtown Toronto.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Light is the base palette; the two dark blocks below redefine only the
     tokens, so every rule in the sheet is written against roles. */
  :root {
    --surface:        #fcfcfb;
    --surface-sunk:   #f0efec;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       rgba(11, 11, 11, 0.10);
    --panel:          rgba(252, 252, 251, 0.92);
    --highlight:      #0b0b0b;
    --shadow:         0 1px 2px rgba(11,11,11,.06), 0 8px 28px rgba(11,11,11,.12);

    /* Shared by both themes. Sequential: one hue, light -> dark, palette blue. */
    --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5;
    --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;

    /* Diverging: blue arm | red arm, lightest at the 1.0 midpoint and darkening
       outward. The red steps mirror the blue ramp's OKLCH lightness values at
       the palette's red hue, so the two arms are balanced by construction. */
    --div-1: #184f95; --div-2: #2a78d6; --div-3: #6da7ec; --div-4: #b7d3f6;
    --div-5: #ffbdb7; --div-6: #ff6f69; --div-7: #d2383a; --div-8: #9b0015;
  }

  /* Dark mode swaps surfaces and ink but keeps the data ramps identical, so the
     same value reads as the same colour in either theme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface:        #1a1a19;
      --surface-sunk:   #383835;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --hairline:       rgba(255, 255, 255, 0.12);
      --panel:          rgba(26, 26, 25, 0.92);
      --highlight:      #ffffff;
      --shadow:         0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.55);

    }
  }
  :root[data-theme="dark"] {
    --surface:        #1a1a19;
    --surface-sunk:   #383835;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       rgba(255, 255, 255, 0.12);
    --panel:          rgba(26, 26, 25, 0.92);
    --highlight:      #ffffff;
    --shadow:         0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.55);

  }

  * { box-sizing: border-box; }

  /* The shared header is a flex item; the map claims whatever height is left. */
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #map { position: absolute; inset: 0; background: var(--surface); }
  .leaflet-container { font-family: inherit; background: var(--surface); }

  /* Panel ------------------------------------------------------------------ */
  #panel {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 1000;
    width: 332px;
    max-height: calc(100% - 32px);
    overflow-y: auto;
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  .panel-scroll { padding: 18px 18px 16px; }
  /* The sheet handle is mobile-only; on desktop the panel is a plain card. */
  .panel-handle-row { display: none; }

  h1 {
    margin: 0 0 5px;
    font-family: "Toronto Subway", system-ui, sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .10em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .subtitle { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.45; }

  .rule { height: 1px; background: var(--hairline); margin: 15px 0 13px; border: 0; }

  .field-label {
    display: block;
    margin: 0 0 7px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Segmented control ------------------------------------------------------ */
  .segmented { display: flex; gap: 3px; padding: 3px; background: var(--surface-sunk); border-radius: 7px; }
  .segmented button {
    flex: 1 1 0;
    padding: 7px 4px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text-secondary);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.25;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  .segmented button:hover { color: var(--text-primary); }
  .segmented button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text-primary);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.10);
  }
  .segmented button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 1px; }

  /* Legend ----------------------------------------------------------------- */
  /* Bars above the ramp show what share of blocks lands in each class, so the
     legend doubles as the distribution rather than needing a separate chart. */
  .strip-caption { margin: 0 0 4px; font-size: 10px; color: var(--text-muted); }
  #histogram { display: flex; align-items: flex-end; gap: 2px; height: 38px; margin-bottom: 3px; }
  #histogram { border-bottom: 1px solid var(--hairline); }
  #histogram div { flex: 1 1 0; background: var(--text-muted); opacity: .38; border-radius: 1.5px 1.5px 0 0; min-height: 2px; }

  #ramp { display: flex; gap: 2px; height: 12px; }
  #ramp div { flex: 1 1 0; border-radius: 1.5px; }

  #ticks { display: flex; margin-top: 5px; font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  /* Each tick sits on the boundary between two swatches: half a swatch of
     leading offset, then one swatch of width per gap. */
  #ticks span { flex: 1 1 0; text-align: center; }
  #ticks span:first-child, #ticks span:last-child { flex: 0.5 1 0; }

  .legend-note { margin: 8px 0 0; font-size: 11px; line-height: 1.4; color: var(--text-muted); }

  /* Readout ---------------------------------------------------------------- */
  #readout { margin-top: 13px; min-height: 118px; }
  .readout-hint { margin: 9px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--text-muted); }
  .stat-row { display: flex; gap: 14px; margin: 0 0 8px; }
  .stat { flex: 1 1 0; }
  .stat dt { margin: 0 0 1px; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .stat dd { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.1; }
  .stat dd span { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .verdict { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--text-secondary); }
  .verdict b { color: var(--text-primary); font-weight: 600; }

  footer { margin-top: 14px; font-size: 10.5px; line-height: 1.5; color: var(--text-muted); }
  footer a { color: inherit; }

  /* Leaflet chrome --------------------------------------------------------- */
  .leaflet-control-attribution {
    background: var(--panel) !important;
    color: var(--text-muted) !important;
    font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--text-secondary) !important; }
  .leaflet-bar a {
    background: var(--panel) !important;
    color: var(--text-primary) !important;
    border-bottom-color: var(--hairline) !important;
  }
  .leaflet-bar a:hover { background: var(--surface-sunk) !important; }

  @media (max-width: 720px) {
    /* Bottom sheet, dragged by its handle between three snap states. */
    #panel {
      position: fixed;
      top: auto; bottom: 0; left: 0; right: 0;
      width: auto;
      max-height: 42vh;
      border-radius: 14px 14px 0 0;
      border-left: 0; border-right: 0; border-bottom: 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, .18);
      transition: max-height 220ms ease;
    }

    /* These vh values are only a pre-JS fallback. On mobile browsers CSS vh is pinned
       to the largest viewport, as if the address bar were hidden, so a sheet sized in
       vh overflows the real viewport whenever the bar is showing. The live heights are
       set inline from window.innerHeight instead. */
    #panel[data-state="minimized"] { max-height: 52px; }
    #panel[data-state="expanded"] { max-height: 82vh; }
    #panel.dragging { transition: none; }

    .panel-handle-row {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      background: var(--panel);
    }

    .panel-drag-handle {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 0 6px;
      border: 0;
      background: none;
      color: var(--text-secondary);
      font: inherit;
      cursor: grab;
      /* Without this the browser claims the gesture and scrolls the panel instead. */
      touch-action: none;
      user-select: none;
    }
    .handle-bar { width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); }
    .handle-label {
      font-size: 10.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    #panel[data-state="minimized"] .handle-label { display: none; }
    #panel[data-state="expanded"] .handle-label::after { content: " (tap to collapse)"; }

    /* Independent of the drag/tap handling, so there is always a way back to the map. */
    .panel-hide-btn {
      flex: none;
      margin-right: 12px;
      padding: 5px 10px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: var(--surface-sunk);
      color: var(--text-secondary);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    #panel[data-state="minimized"] .panel-hide-btn { display: none; }
    /* Collapse to exactly the handle row, so no stray line of content peeks out. */
    #panel[data-state="minimized"] .panel-scroll { display: none; }

    .panel-scroll { padding: 4px 18px 24px; }
    .leaflet-control-attribution { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .segmented button { transition: none; }
  }
</style>
</head>
<body>
<script src="/header.js"></script>

<div id="stage">
  <div id="map"></div>

  <aside id="panel" data-state="collapsed">
    <div class="panel-handle-row">
      <button class="panel-drag-handle" id="panel-toggle" aria-label="Toggle panel" aria-expanded="false">
        <span class="handle-bar"></span>
        <span class="handle-label">Legend &amp; views</span>
      </button>
      <button class="panel-hide-btn" id="panel-hide" aria-label="Hide panel and show the map">Hide</button>
    </div>

    <div class="panel-scroll">
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <hr class="rule">

    <span class="field-label" id="metric-label">Shade blocks by</span>
    <div class="segmented" role="group" aria-labelledby="metric-label" id="metric-buttons"></div>

    <hr class="rule">

    <span class="field-label" id="legend-title"></span>
    <p class="strip-caption">Share of blocks</p>
    <div id="histogram"></div>
    <div id="ramp"></div>
    <div id="ticks"></div>
    <p class="legend-note" id="legend-note"></p>

    <div id="readout"></div>

    <footer id="footer"></footer>
    </div>
  </aside>
</div>

/* Geometry ---------------------------------------------------------------- */

/* Inverse of the Python encoder: signed, zigzagged, 5-bit-chunked deltas at
   1e-5 degrees, latitude before longitude. */
function decodeRing(encoded) {
  const points = [];
  let index = 0, lat = 0, lon = 0;
  while (index < encoded.length) {
    const delta = [0, 0];
    for (let axis = 0; axis < 2; axis++) {
      let result = 0, shift = 0, byte;
      do {
        byte = encoded.charCodeAt(index++) - 63;
        result |= (byte & 0x1f) << shift;
        shift += 5;
      } while (byte >= 0x20);
      delta[axis] = (result & 1) ? ~(result >> 1) : (result >> 1);
    }
    lat += delta[0];
    lon += delta[1];
    points.push([lat / 1e5, lon / 1e5]);
  }
  return points;
}

/* Colour ------------------------------------------------------------------ */

const styles = getComputedStyle(document.documentElement);
function tokens(prefix, count) {
  const out = [];
  for (let i = 1; i <= count; i++) out.push(styles.getPropertyValue(`--${prefix}-${i}`).trim());
  return out;
}
/* Read once per repaint rather than per block: 13k getPropertyValue calls per
   frame is the difference between an instant repaint and a visible stall. */
let ramps = {};
function readRamps() {
  ramps = { sequential: tokens("seq", 7), diverging: tokens("div", 8) };
}
readRamps();

function classOf(value, edges) {
  let index = 0;
  while (index < edges.length && value >= edges[index]) index++;
  return index;
}

/* Formatting -------------------------------------------------------------- */

const formatMinutes = (m) => `${Math.round(m)}`;
const formatRatio = (r) => r.toFixed(2);

function edgeLabel(metric, edge) {
  return metric === "ratio" ? formatRatio(edge) : String(edge);
}

/* Map --------------------------------------------------------------------- */

/* zoomSnap 0.25 lets the city fill the frame instead of snapping down a whole
   zoom level and leaving half the viewport as lake. */
const map = L.map("map", { zoomControl: false, preferCanvas: true, zoomSnap: 0.25 });
L.control.zoom({ position: "topright" }).addTo(map);

const cityBounds = L.latLngBounds([DATA.bounds[1], DATA.bounds[0]], [DATA.bounds[3], DATA.bounds[2]]);
// A view has to exist before any layer can be added; frameCity() refines it
// at boot, once the panel has been laid out and can be measured.
map.fitBounds(cityBounds);
function frameCity() {
  /* Fit around the panel rather than under it: on wide screens the panel takes
     the left edge, on narrow ones it sits along the bottom. */
  const panel = document.getElementById("panel").getBoundingClientRect();
  const narrow = window.innerWidth <= 720;
  map.fitBounds(cityBounds, {
    paddingTopLeft: narrow ? [16, 16] : [panel.width + 32, 24],
    paddingBottomRight: narrow ? [16, panel.height + 16] : [24, 24],
    animate: false,
  });
}

const OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const CARTO = '&copy; <a href="https://carto.com/attributions">CARTO</a>';

/* Basemap in two pieces so block fills sit between the streets and the place
   labels -- labels stay legible over even the darkest class. */
const blocksPane = map.createPane("blocks");
blocksPane.style.zIndex = 350;
/* Translucency is applied ONCE to the whole pane rather than per polygon. With a
   per-polygon fillOpacity, each shared border is rasterised twice and the two
   antialiased coverages composite darker than either fill -- which is the black
   webbing between blocks, worst when zoomed out and almost every pixel is an edge
   pixel. Opaque fills composited as one layer have no seam to darken. */
blocksPane.style.opacity = 0.85;
const labelPane = map.createPane("labels");
labelPane.style.zIndex = 450;
labelPane.style.pointerEvents = "none";

let baseLayer = null, labelLayer = null;
function drawBasemap() {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const flavour = dark ? "dark" : "light";
  if (baseLayer) map.removeLayer(baseLayer);
  if (labelLayer) map.removeLayer(labelLayer);
  baseLayer = L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/${flavour}_nolabels/{z}/{x}/{y}{r}.png`,
    { maxZoom: 18, attribution: `${OSM} ${CARTO}` }
  ).addTo(map);
  labelLayer = L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/${flavour}_only_labels/{z}/{x}/{y}{r}.png`,
    { maxZoom: 18, pane: "labels" }
  ).addTo(map);
}
drawBasemap();

const renderer = L.canvas({ pane: "blocks", padding: 0.3 });

/* Welding neighbours together is only needed while blocks are near pixel size. Zoomed
   in, the same weight would visibly fatten each block and paper over the genuine gaps
   -- ravines, rail corridors, blocks with no routable path -- so it tapers off. */
function strokeWeightForZoom() {
  const zoom = map.getZoom();
  if (zoom <= 11) return 1.5;
  if (zoom <= 13) return 1.0;
  return 0.5;
}

const blocks = DATA.geometry.map((polygons, i) => {
  const rings = polygons.map((polygon) => polygon.map(decodeRing));
  const layer = L.polygon(rings, {
    renderer: renderer,
    /* A hairline stroke in the fill's own colour closes the sub-pixel slivers left
       by simplifying each block independently: neighbours no longer round their
       shared border to identical vertices, so without it the basemap shows through
       the gap as a bright thread. */
    stroke: true,
    weight: strokeWeightForZoom(),
    color: "#000",
    fillOpacity: 1,
    fillColor: "#000",
  });
  layer.index = i;
  return layer;
});
const blockGroup = L.featureGroup(blocks).addTo(map);

/* The hover outline lives in its own SVG pane. Restyling a canvas layer forces
   a redraw of all 13k polygons; a separate one-polygon layer costs nothing. */
map.createPane("highlight").style.zIndex = 460;
map.getPane("highlight").style.pointerEvents = "none";
const highlightCasing = L.polygon([], {
  pane: "highlight",
  color: styles.getPropertyValue("--surface").trim(),
  weight: 4,
  fill: false,
}).addTo(map);
const highlight = L.polygon([], {
  pane: "highlight",
  color: styles.getPropertyValue("--highlight").trim(),
  weight: 2,
  fill: false,
}).addTo(map);

function setHighlight(latlngs) {
  highlightCasing.setLatLngs(latlngs);
  highlight.setLatLngs(latlngs);
}

/* Rendering --------------------------------------------------------------- */

let currentMetric = "ratio";
let pinned = null;

function repaint() {
  const spec = DATA.metrics[currentMetric];
  const ramp = ramps[spec.kind];
  const values = DATA[currentMetric];
  for (const layer of blocks) {
    const colour = ramp[classOf(values[layer.index], spec.edges)];
    layer.options.fillColor = colour;
    layer.options.color = colour;
  }
  renderer._redraw();
}

function renderLegend() {
  const spec = DATA.metrics[currentMetric];
  const ramp = ramps[spec.kind];
  const counts = spec.histogram;
  const peak = Math.max(...counts);

  document.getElementById("legend-title").textContent = `${spec.label} (${spec.unit})`;
  document.getElementById("histogram").innerHTML =
    counts.map((c) => `<div style="height:${Math.max(2, (c / peak) * 100)}%"></div>`).join("");
  document.getElementById("ramp").innerHTML =
    counts.map((_, i) => `<div style="background:${ramp[i]}"></div>`).join("");

  /* One empty span at each end so the edge labels land on the seams between
     swatches rather than under their centres. */
  document.getElementById("ticks").innerHTML =
    "<span></span>" +
    spec.edges.map((e) => `<span>${edgeLabel(currentMetric, e)}</span>`).join("") +
    "<span></span>";

  document.getElementById("legend-note").textContent =
    currentMetric === "ratio"
      ? "Blue: transit matches or beats driving. Red: transit takes longer."
      : `Minutes to ${DATA.hub}. Darker is longer.`;
}

    <div class="stat-row">
      <dl class="stat"><dt>Transit</dt><dd>${formatMinutes(transit)}<span> min</span></dd></dl>
      <dl class="stat"><dt>Driving</dt><dd>${formatMinutes(driving)}<span> min</span></dd></dl>
    </div>
    <p class="verdict">${verdict}</p>`;
}

let appliedStrokeWeight = strokeWeightForZoom();
map.on("zoomend", () => {
  const weight = strokeWeightForZoom();
  if (weight === appliedStrokeWeight) return;
  appliedStrokeWeight = weight;
  for (const layer of blocks) layer.options.weight = weight;
  renderer._redraw();
});

/* Interaction ------------------------------------------------------------- */

blockGroup.on("mouseover", (event) => {
  if (pinned !== null) return;
  setHighlight(event.layer.getLatLngs());
  renderReadout(event.layer.index);
});
blockGroup.on("mouseout", () => {
  if (pinned !== null) return;
  setHighlight([]);
  renderReadout(null);
});
blockGroup.on("click", (event) => {
  // The map click handler below would otherwise fire next and unpin this.
  L.DomEvent.stopPropagation(event.originalEvent);
  const index = event.layer.index;
  pinned = pinned === index ? null : index;
  setHighlight(pinned === null ? [] : event.layer.getLatLngs());
  renderReadout(pinned);
});
map.on("click", () => {
  pinned = null;
  setHighlight([]);
  renderReadout(null);
});

const buttons = document.getElementById("metric-buttons");
buttons.innerHTML = Object.entries(DATA.metrics)
  .map(([name, spec]) =>
    `<button type="button" data-metric="${name}" aria-pressed="${name === currentMetric}">${spec.label}</button>`)
  .join("");
buttons.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  currentMetric = button.dataset.metric;
  for (const other of buttons.querySelectorAll("button")) {
    other.setAttribute("aria-pressed", String(other === button));
  }
  repaint();
  renderLegend();
});

/* Follow the OS theme: tokens swap in CSS, but the ramps and basemap are read
   in JS and have to be re-read. */
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  readRamps();
  highlight.setStyle({ color: styles.getPropertyValue("--highlight").trim() });
  highlightCasing.setStyle({ color: styles.getPropertyValue("--surface").trim() });
  drawBasemap();
  repaint();
  renderLegend();
});

/* Mobile bottom sheet ----------------------------------------------------- */

/* Dragged by its handle between three snap states: minimized (handle only),
   collapsed (the default peek), expanded. Dragging down from the default therefore
   has somewhere smaller to land instead of springing back. Pointer events cover
   mouse and touch in one API. No-op on desktop, where the panel is a plain card. */

const MOBILE_BREAKPOINT = "(max-width: 720px)";
const isMobile = () => window.matchMedia(MOBILE_BREAKPOINT).matches;

const panel = document.getElementById("panel");
const panelToggle = document.getElementById("panel-toggle");
const panelHide = document.getElementById("panel-hide");

const PANEL_MINIMIZED_PX = 52;
const PANEL_COLLAPSED_VH = 0.42;
const PANEL_EXPANDED_VH = 0.82;
const DRAG_MOVE_THRESHOLD = 6;

function panelTargetHeight(state) {
  // window.innerHeight is the real visible viewport, unlike CSS vh on mobile.
  const vh = window.innerHeight;
  if (state === "minimized") return PANEL_MINIMIZED_PX;
  if (state === "expanded") return vh * PANEL_EXPANDED_VH;
  return vh * PANEL_COLLAPSED_VH;
}

function setPanelState(state) {
  panel.dataset.state = state;
  panelToggle.setAttribute("aria-expanded", String(state === "expanded"));
  // An inline max-height is not scoped by media query, so it would clamp the desktop
  // card too -- only set it on mobile, and clear it when crossing back.
  if (isMobile() && !panel.classList.contains("dragging")) {
    panel.style.maxHeight = `${panelTargetHeight(state)}px`;
  } else if (!isMobile()) {
    panel.style.maxHeight = "";
  }
  map.invalidateSize();
}

panelHide.addEventListener("click", () => setPanelState("minimized"));

(function setupPanelDrag() {
  let dragging = false, startY = 0, startHeight = 0, moved = false, lastHeight = 0;

  panelToggle.addEventListener("pointerdown", (event) => {
    if (!isMobile()) return;
    dragging = true;
    moved = false;
    startY = event.clientY;
    startHeight = panel.getBoundingClientRect().height;
    lastHeight = startHeight;
    panel.classList.add("dragging");
    panel.style.maxHeight = "none";
    try {
      panelToggle.setPointerCapture(event.pointerId);
    } catch (err) {
      // Pointer capture only keeps tracking if the finger slides off the handle;
      // the drag maths below works without it.
    }
  });

  panelToggle.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const deltaY = startY - event.clientY; // positive while dragging upward
    if (Math.abs(deltaY) > DRAG_MOVE_THRESHOLD) moved = true;
    const maxHeight = window.innerHeight * PANEL_EXPANDED_VH + 24;
    lastHeight = Math.min(maxHeight, Math.max(PANEL_MINIMIZED_PX, startHeight + deltaY));
    panel.style.height = `${lastHeight}px`;
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove("dragging");
    panel.style.height = "";
    panel.style.maxHeight = "";
    if (!moved) return; // a plain tap; the click listener below handles it

    const vh = window.innerHeight;
    const collapsedPx = vh * PANEL_COLLAPSED_VH;
    const expandedPx = vh * PANEL_EXPANDED_VH;
    if (lastHeight < (PANEL_MINIMIZED_PX + collapsedPx) / 2) setPanelState("minimized");
    else if (lastHeight < (collapsedPx + expandedPx) / 2) setPanelState("collapsed");
    else setPanelState("expanded");
  }

  panelToggle.addEventListener("pointerup", endDrag);
  panelToggle.addEventListener("pointercancel", endDrag);

  // Browsers only fire click when no real drag happened, which is a more reliable
  // tap signal on touch hardware than a hand-rolled pixel threshold.
  panelToggle.addEventListener("click", () => {
    if (!isMobile()) return;
    setPanelState(panel.dataset.state === "expanded" ? "collapsed" : "expanded");
  });
})();

/* Boot -------------------------------------------------------------------- */

document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle;
document.getElementById("footer").innerHTML =
  `${DATA.count.toLocaleString()} dissemination blocks. Travel times from the Google Distance Matrix API; ` +
  `block boundaries from <a href="https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/index2021-eng.cfm">Statistics Canada</a>. ` +
  `Blocks with no routable path are left unshaded.`;

repaint();
renderLegend();
renderReadout(null);
setPanelState("collapsed");
frameCity();

let resizeTimer;
window.addEventListener("resize", () => {
  // Also covers the mobile address bar showing/hiding, which changes innerHeight.
  if (!panel.classList.contains("dragging")) setPanelState(panel.dataset.state);
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(frameCity, 200);
});
</script>
</body>
</html>
